name: Sub Checker CL100

on:
  workflow_dispatch:
  schedule:
    - cron: "*/18 * * * *"   # اجرای cl20.py هر ۱ ساعت

permissions:
  contents: write

jobs:
  cl100-job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests psutil retrying PyYaml || echo "skip install"
      - run: |
          rm -f final20.txt normal100.txt
          timeout 300s python cl100.py || echo "❌ cl100.py failed or skipped"
      - run: |
          if [[ -s final100.txt || -s normal100.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final1000.txt normal100.txt
            git commit -m "auto update from cl100.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final100.txt یا normal100.txt خالی یا موجود نیست، commit نشد"
          fi
