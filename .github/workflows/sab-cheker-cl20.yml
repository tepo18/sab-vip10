name: Sub Checker CL20

on:
  workflow_dispatch:
  schedule:
    - cron: " */10 * * * *"   # اجرای cl20.py هر ۱ ساعت

permissions:
  contents: write

jobs:
  cl20-job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests psutil retrying PyYaml || echo "skip install"
      - run: |
          rm -f final20.txt normal20.txt
          timeout 300s python cl20.py || echo "❌ cl20.py failed or skipped"
      - run: |
          if [[ -s final20.txt || -s normal20.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final20.txt normal20.txt
            git commit -m "auto update from cl20.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final20.txt یا normal20.txt خالی یا موجود نیست، commit نشد"
          fi
