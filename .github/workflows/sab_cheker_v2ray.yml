name: v2ray.py

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # اجرای v2ray.py هر ۱۲ ساعت

permissions:
  contents: write

jobs:
  v2ray-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install requests base64 json || echo "skip install"

      - name: Run v2ray.py
        run: |
          rm -f output/v2ray.txt output/v2ray1.txt output/v2ray2.txt output/v2ray3.txt output/v2ray4.txt output/v2ray5.txt output/v2ray6.txt output/v2ray7.txt output/v2ray8.txt output/v2ray9.txt
          timeout 180s python v2ray.py || echo "❌ v2ray.py failed or skipped"

      - name: Commit and push results
        run: |
          if [[ -s output/v2ray.txt || -s output/v2ray1.txt || -s output/v2ray2.txt || -s output/v2ray3.txt || -s output/v2ray4.txt || -s output/v2ray5.txt || -s output/v2ray6.txt || -s output/v2ray7.txt || -s output/v2ray8.txt || -s output/v2ray9.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add output/v2ray.txt output/v2ray1.txt output/v2ray2.txt output/v2ray3.txt output/v2ray4.txt output/v2ray5.txt output/v2ray6.txt output/v2ray7.txt output/v2ray8.txt output/v2ray9.txt
            git commit -m "auto update from v2ray.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ Output files are empty or not found, no commit made"
          fi
