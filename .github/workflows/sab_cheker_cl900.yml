name: YAML Proxy Auto Update

on:
  schedule:
    - cron: "0 * * * *"   # هر ساعت یک بار اجرا می‌شود
  workflow_dispatch:       # امکان اجرا دستی

permissions:
  contents: write          # اجازه commit و push به repo

jobs:
  update-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1) چک کردن سورس repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2) نصب Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # 3) نصب کتابخانه‌های مورد نیاز
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML || echo "skip install"

      # 4) اجرای cl90.py
      - name: Run cl90.py
        run: |
          echo "[*] Running cl90.py..."
          python cl90.py || echo "❌ cl90.py failed"

      # 5) Commit و Push خروجی‌ها
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add normal.yaml final.yaml
          git diff --cached --quiet || git commit -m "Auto-update proxies [skip ci]"
          git push || echo "⚠️ No changes to push"
