name: Sub Checker All-in-One Synced

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # اجرای cl100.py هر ۱۰ دقیقه
    - cron: "*/15 * * * *"   # اجرای cl200.py هر ۱۵ دقیقه
    - cron: "0 0 * * *"   # غیرفعال کردن اجرای cl3.py
    - cron: "0 0 * * *"   # غیرفعال کردن اجرای cl4.py

permissions:
  contents: write

jobs:
  cl100-job:
    name: Run cl100.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests psutil retrying PyYaml || echo "skip install"
      - run: |
          rm -f final100.txt normal100.txt
          timeout 180s python cl100.py || echo "❌ cl100.py failed or skipped"
      - run: |
          if [[ -s final100.txt || -s normal100.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final100.txt normal100.txt
            git commit -m "auto update from cl100.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final100.txt یا normal100.txt خالی یا موجود نیست، commit نشد"
          fi

  cl200-job:
    name: Run cl200.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
