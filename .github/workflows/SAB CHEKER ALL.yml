          else
            echo "⚠️ final200.txt یا normal200.txt خالی یا موجود نیست، commit نشد"
          fi

  cl3-job:
    name: Run cl3.py (Disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests psutil retrying PyYaml || echo "skip install"
      - run: |
